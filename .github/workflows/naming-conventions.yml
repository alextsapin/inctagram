name: Naming conventions

on:
  pull_request_target:
    branches:
      - main
      - develop
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - ready_for_review

# Only reads PR metadata using GitHub's API; never check out PR code.
permissions:
  pull-requests: read

jobs:
  naming-conventions-check:
    name: Naming conventions check
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check branch name and commit subjects
        env:
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.request
          from datetime import datetime, timezone

          # Existing commits are grandfathered; only commits on/after this date are checked.
          cutoff = datetime(2026, 10, 26, tzinfo=timezone.utc)
          branch_pattern = re.compile(
              r"^(feature|fix|refactor|chore|docs|test|hotfix)/"
              r"(?:BLD-[1-9][0-9]*-)?[a-z0-9]+(?:-[a-z0-9]+)*$"
          )
          commit_pattern = re.compile(
              r"^(feat|fix|refactor|docs|test|chore|ci|style|perf)"
              r"(?:\([A-Z]+-[1-9][0-9]*\))?: "
              r"[a-z][^\r\n]*(?<![.\s])$"
          )

          repository = os.environ["GITHUB_REPOSITORY"]
          base = os.environ["PR_BASE"]
          branch = os.environ["PR_HEAD"]
          head_repository = os.environ["PR_HEAD_REPO"]
          number = os.environ["PR_NUMBER"]
          token = os.environ["GH_TOKEN"]
          errors = []

          # PRs from develop to main are release PRs: commits were reviewed in develop.
          release_pr = (
              base == "main"
              and branch == "develop"
              and head_repository == repository
          )

          if not release_pr and not branch_pattern.fullmatch(branch):
              errors.append(
                  f"Invalid branch '{branch}'. Expected type/BLD-123-short-description "
                  "or type/short-description, with a documented type."
              )

          if release_pr:
              print("Release PR develop -> main: commit name checks skipped.")
          else:
              inspected = 0
              grandfathered = 0
              page = 1
              while True:
                  url = (
                      f"{os.environ['GITHUB_API_URL']}/repos/{repository}"
                      f"/pulls/{number}/commits?per_page=100&page={page}"
                  )
                  request = urllib.request.Request(
                      url,
                      headers={
                          "Authorization": f"Bearer {token}",
                          "Accept": "application/vnd.github+json",
                          "X-GitHub-Api-Version": "2022-11-28",
                      },
                  )
                  with urllib.request.urlopen(request, timeout=20) as response:
                      commits = json.load(response)
                  for commit in commits:
                      # Git-generated merge commits are not authored task commits.
                      if len(commit.get("parents", [])) > 1:
                          continue
                      info = commit["commit"]
                      date_str = info["committer"]["date"]
                      committed = datetime.fromisoformat(date_str.replace("Z", "+00:00"))
                      if committed < cutoff:
                          grandfathered += 1
                          continue
                      inspected += 1
                      subject = info["message"].splitlines()[0]
                      if not commit_pattern.fullmatch(subject):
                          errors.append(
                              f"Commit {commit['sha'][:8]} has invalid subject: {subject!r}. "
                              "Use feat(BLD-123): short description."
                          )
                      else:
                          description = subject.split(": ", 1)[1].lower()
                          if description in {"changes", "update", "fix stuff", "wip", "new stuff"}:
                              errors.append(
                                  f"Commit {commit['sha'][:8]}: description is too generic."
                              )
                  if len(commits) < 100:
                      break
                  page += 1
                  if page > 10:
                      raise RuntimeError("PR too large to check safely (over 1000 commits).")
              print(f"Checked {inspected} new commits; ignored {grandfathered} older commits.")

          for error in errors:
              print(f"::error::{error}")
          if errors:
              sys.exit(1)
          print("Branch and commit naming conventions passed.")
          PY
